# Mr. Advice appveyor.yml script

version: '{branch}-{build}'
image: Visual Studio 2026

install:
- ps: |
    Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:temp\dotnet-install.ps1"
    & $env:temp\dotnet-install.ps1 -Architecture x64 -Version '11.0.100' -InstallDir "$env:ProgramFiles\dotnet"

branches:
  only:
    - fody
    - master

before_build:
  - cmd: dotnet --version
  - nuget restore MrAdvice.slnx

configuration: Release

build:
  parallel: true
  project: MrAdvice.slnx
  publish_nuget: false
  publish_nuget_symbols: false
  verbosity: minimal

test:
  assemblies:
    - '**\*Test.exe'
    - '**\*Test.dll'

artifacts:
  - path: 'MrAdvice.Weaver\bin\$(configuration)\*.nupkg'

deploy:
  provider: NuGet
  api_key:
    secure: 1FFrOQ1to7x108dE3YPb8ACDEx7kJOJUXBw1M3RE5b8JeMa/G5qYffI1ZJg3td7o
  skip_symbols: false

after_test:
  ps: Get-ChildItem .\*.nupkg | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }
